name: Bug report
description: Segnala un problema con l'integrazione 3BMeteo Qualità dell'aria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per il report. Questo è un progetto **non ufficiale**: supporto e
        manutenzione non sono garantiti e i dati dipendono da un servizio terzo.
  - type: input
    id: version
    attributes:
      label: Versione integrazione
      description: Versione mostrata in HACS o nel manifest.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Versione Home Assistant
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Località
      description: Comune configurato (es. Modena, Bomporto).
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Descrizione del problema
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log rilevanti
      render: text
    validations:
      required: false
